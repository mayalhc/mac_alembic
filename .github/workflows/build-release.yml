name: Build Alembic (External) and Release

on:
  push:
  workflow_dispatch:

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ 내 레포 (릴리즈 대상)
      - name: Checkout My Repo
        uses: actions/checkout@v4

      # 2️⃣ 외부 소스 가져오기
      - name: Clone PyAlembic Source
        run: |
          git clone https://github.com/null14/PyAlembic-macOS-Build.git source

      # 3️⃣ Python 3.11 (Blender 기준)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4️⃣ 기본 빌드 툴
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools build

      # 5️⃣ 🔥 빌드 (경로 문제 해결 완료 버전)
      - name: Build
        run: |
          echo "==== ROOT FILES ===="
          ls -al

          echo "==== CLONE CHECK ===="
          ls -al source

          cd source

          echo "==== INSIDE SOURCE ===="
          ls -al

          chmod +x build.sh
          ./build.sh

      # 6️⃣ 결과 수집
      - name: Collect Artifacts
        run: |
          mkdir -p release
          find source -name "*.whl" -exec cp {} release/ \;
          find source -name "*.dylib" -exec cp {} release/ \;

      # 7️⃣ 결과 확인
      - name: Debug Release Files
        run: |
          echo "==== RELEASE FILES ===="
          ls -al release

      # 8️⃣ 릴리즈 생성 + 업로드
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}