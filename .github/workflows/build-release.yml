name: Build Alembic (External) and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4

      - name: Clone PyAlembic Source
        run: git clone https://github.com/null14/PyAlembic-macOS-Build.git source

      - name: Install Blender
        run: brew install --cask blender

      - name: Patch build.sh
        run: |
          BLENDER_PY=$(ls -d /Applications/Blender.app/Contents/Resources/*/python/bin/python3.11 | head -n 1)

          cat << 'EOF' > source/build.sh
          #!/bin/bash
          set -e

          echo "Using Blender Python: $BLENDER_PY"

          export PYTHON_BIN="$BLENDER_PY"

          cd PyAlembic

          $PYTHON_BIN -m pip install --upgrade pip
          $PYTHON_BIN -m pip install wheel setuptools build

          $PYTHON_BIN -m build

          echo "=== BUILD DONE ==="
          EOF

          chmod +x source/build.sh

      - name: Build
        run: |
          cd source
          ./build.sh

      - name: Collect Artifacts
        run: |
          mkdir -p release
          find source -name "*.whl" -exec cp {} release/ \;
          find source -name "*.dylib" -exec cp {} release/ \;

      - name: Debug Release Files
        run: ls -al release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
