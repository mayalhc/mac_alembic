name: Build Alembic + PyAlembic (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deps
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost imath openexr zlib

      # alembic source
      - name: Clone Alembic
        run: |
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git submodule update --init --recursive

      # build alembic (C++)
      - name: Build Alembic
        run: |
          mkdir alembic/build
          cd alembic/build

          cmake .. \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=OFF \
            -DCMAKE_BUILD_TYPE=Release

          make -j$(sysctl -n hw.ncpu)

      # build PyAlembic (python binding)
      - name: Build PyAlembic
        run: |
          cd alembic/build/python/PyAlembic

          python3 -m pip install --upgrade pip
          python3 -m pip install wheel setuptools

          python3 setup.py bdist_wheel

      # collect
      - name: Collect Artifacts
        run: |
          mkdir -p release
          find alembic -name "*.whl" -exec cp {} release/ \;
          find alembic -name "*.dylib" -exec cp {} release/ \;

      # debug
      - name: Debug
        run: ls -al release

      # release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
