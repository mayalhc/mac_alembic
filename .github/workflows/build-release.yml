name: Build Alembic (External) and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ 내 레포
      - name: Checkout My Repo
        uses: actions/checkout@v4

      # 2️⃣ 외부 소스
      - name: Clone PyAlembic Source
        run: git clone https://github.com/null14/PyAlembic-macOS-Build.git source

      # 3️⃣ Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4️⃣ 의존성
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools build

      # 5️⃣ 빌드
      - name: Build
        run: |
          ls -al
          ls -al source

          cd source
          ls -al

          chmod +x build.sh
          ./build.sh

      # 6️⃣ 결과 수집
      - name: Collect Artifacts
        run: |
          mkdir -p release
          find source -name "*.whl" -exec cp {} release/ \;
          find source -name "*.dylib" -exec cp {} release/ \;

      # 7️⃣ 확인
      - name: Debug Release Files
        run: ls -al release

      # 8️⃣ 릴리즈
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
