name: Build Alembic (External) and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4

      - name: Clone PyAlembic Source
        run: git clone https://github.com/null14/PyAlembic-macOS-Build.git source

      - name: Install Blender
        run: brew install --cask blender

      - name: Build Directly (no build.sh)
        run: |
          BLENDER_PY=$(find /Applications/Blender.app -type f -path "*/python/bin/python3.*" | head -n 1)

          echo "Using Blender Python: $BLENDER_PY"
          if [ -z "$BLENDER_PY" ]; then exit 1; fi

          $BLENDER_PY -m ensurepip || true
          $BLENDER_PY -m pip install --upgrade pip
          $BLENDER_PY -m pip install wheel setuptools

          cd source/PyAlembic

          $BLENDER_PY setup.py bdist_wheel

      - name: Collect Artifacts
        run: |
          mkdir -p release
          find source -name "*.whl" -exec cp {} release/ \;
          find source -name "*.dylib" -exec cp {} release/ \;

      - name: Debug Release Files
        run: ls -al release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
