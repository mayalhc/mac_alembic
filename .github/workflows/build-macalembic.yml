name: macalembic (arm64, 3.11 + 3.13, drop-in)

# Produces the macalembic/ folder GroomForge PRO ships, with both Python
# versions in it, ready to drop straight into the add-on.
#
# Two things go wrong in build-release.yml and are fixed here:
#
#  1. It packages the ABI-tagged module (alembic.cpython-313-darwin.so) into a
#     per-version folder, but those folders then get merged by hand and the tag
#     stripped to a plain "alembic.so". Both versions collapse onto the same
#     name and one silently overwrites the other - which is why the shipping
#     folder carries every 3.13 support dylib but no 3.13 binding, and why Macs
#     on Blender 5.2/5.3 (Python 3.13) get "Alembic library not available".
#     The tag is what lets Python pick the right module, exactly like the
#     cp311/cp313 .pyd files on Windows. Keep it.
#
#  2. There is no install_name_tool pass, so the artifacts still point at the
#     runner's $HOME/boost-install and /opt/homebrew paths. Anything that keeps
#     such a path cannot load on a customer's Mac.
#
# The final job merges both matrix builds into one folder and fails if any
# dependency still reaches outside it.

on:
  workflow_dispatch:
    inputs:
      boost_version:
        description: "Boost version"
        default: "1.91.0"
      imath_tag:
        description: "Imath git tag (3.2+ exports PyImath as an Imath component)"
        default: "v3.2.0"
      alembic_tag:
        description: "Alembic git tag"
        default: "1.8.7"

jobs:
  build:
    runs-on: macos-14                      # arm64; macos-13 is Intel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]   # Blender 4.2-5.0 / 5.2-5.3
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pin the interpreter
        run: |
          set -eux
          python -VV
          echo "PY_SHORT=$(python -c 'import sys;print("%d%d"%sys.version_info[:2])')" >> $GITHUB_ENV
          echo "PYVER=${{ matrix.python-version }}" >> $GITHUB_ENV
          echo "PY_BIN=$(which python)" >> $GITHUB_ENV
          echo "PY_INC=$(python -c 'import sysconfig;print(sysconfig.get_paths()["include"])')" >> $GITHUB_ENV
          echo "PY_LIB=$(python -c 'import sysconfig;print(sysconfig.get_config_var("LIBDIR"))')" >> $GITHUB_ENV

      - run: brew install cmake ninja
      - run: python -m pip install numpy      # PyImath needs it at configure time

      - name: Boost.Python against this interpreter
        run: |
          set -eux
          BU=$(echo "${{ github.event.inputs.boost_version }}" | tr '.' '_')
          curl -fL -o boost.tar.gz \
            "https://archives.boost.io/release/${{ github.event.inputs.boost_version }}/source/boost_${BU}.tar.gz"
          tar xf boost.tar.gz && cd "boost_${BU}"
          echo "using python : ${PYVER} : ${PY_BIN} : ${PY_INC} : ${PY_LIB} ;" > "$HOME/user-config.jam"
          ./bootstrap.sh --with-libraries=python --prefix="$HOME/boost-install"
          # bootstrap writes its own 'using python' line; show it, because if it
          # picked a different interpreter than user-config.jam the python
          # library silently comes out for the wrong version - or not at all.
          cat project-config.jam
          ./b2 -j3 --with-python python=${PYVER} link=shared variant=release \
               cxxflags="-std=c++17 -arch arm64" linkflags="-arch arm64" install
          ls -l "$HOME/boost-install/lib"
          if [ -z "$(find "$HOME/boost-install/lib" -name 'libboost_python*' -print -quit)" ]; then
            echo 'FAIL: Boost.Python was not built - check the project-config.jam above'
            exit 1
          fi
          # Imath does find_package(Boost REQUIRED COMPONENTS python) with no
          # version suffix, so FindBoost looks for a plain libboost_python.
          # b2 only produces the versioned name; add the plain alias.
          ln -sf "libboost_python${PY_SHORT}.dylib" "$HOME/boost-install/lib/libboost_python.dylib"
          ls -l "$HOME/boost-install/lib"

      - name: Imath + PyImath
        run: |
          set -eux
          git clone --depth 1 -b ${{ github.event.inputs.imath_tag }} \
            https://github.com/AcademySoftwareFoundation/Imath.git
          cmake -S Imath -B build-imath -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/imath-install" \
            -DCMAKE_PREFIX_PATH="$HOME/boost-install" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON -DPYTHON=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup" \
            -DCMAKE_MODULE_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup" \
            -DBoost_NO_BOOST_CMAKE=ON -DBoost_NO_SYSTEM_PATHS=ON \
            -DBOOST_ROOT="$HOME/boost-install" \
            -DCMAKE_POLICY_DEFAULT_CMP0144=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD \
            -DBoost_ROOT="$HOME/boost-install" \
            -DBoost_PYTHON_VERSION="${PYVER}" \
            -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew \
            -DPython_EXECUTABLE="$PY_BIN" -DPython3_EXECUTABLE="$PY_BIN" \
            -DPython_ROOT_DIR="$(dirname $(dirname $PY_BIN))" \
            2>&1 | tee imath-configure.log
          cmake --build build-imath --target install

      - name: PyImath must exist, or Alembic cannot link
        run: |
          set -eux
          # Imath skips PyImath silently when Boost.Python or numpy is missing.
          # The failure only shows up much later, as
          #   Target "alembic" links to Imath::PyImath_Python3_13 ... not found
          grep -iE 'python|boost|numpy' imath-configure.log || true
          ls -l "$HOME/imath-install/lib" | grep -i pyimath || true
          ls "$HOME/imath-install/lib/cmake/Imath/" || true
          if [ -z "$(find "$HOME/imath-install" -name 'libPyImath*' -print -quit)" ]; then
            echo 'FAIL: Imath built without PyImath - see the configure log above'
            exit 1
          fi
          # The library existing is not enough. Alembic does
          #   find_package(Imath COMPONENTS PyImath)
          # and ImathConfig.cmake answers that by include()ing PyImathTargets.cmake,
          # so THAT file is what has to be installed. Grepping the directory for the
          # string "PyImath" is not a test - ImathConfig.cmake always contains it.
          echo '--- installed Imath cmake package ---'
          ls -l "$HOME/imath-install/lib/cmake/Imath/"
          echo '--- exported target names ---'
          grep -rhoE '(Imath|PyImath)::[A-Za-z0-9_]+' "$HOME/imath-install/lib/cmake/" | sort -u
          if [ ! -f "$HOME/imath-install/lib/cmake/Imath/PyImathTargets.cmake" ]; then
            echo 'FAIL: PyImathTargets.cmake was not installed, so'
            echo '      find_package(Imath COMPONENTS PyImath) cannot succeed and'
            echo '      Alembic falls back to a target name nothing defines.'
            exit 1
          fi

      - name: Give Alembic the target name it falls back to
        run: |
          set -eux
          # Imath 3.2 exports the binding as the target Imath::PyImath. The
          # _Python3_13 part is only the library file's OUTPUT_NAME, not a target.
          # Alembic tries Imath::PyImath first and, when that lookup fails, falls
          # back to the Imath 3.1-era name Imath::PyImath_Python<maj>_<min>. That
          # fallback path calls find_package(Imath) WITHOUT the PyImath component,
          # so PyImathTargets.cmake is never included and the name exists nowhere.
          # Define it here, pointing at the target Imath really exports.
          CFG="$HOME/imath-install/lib/cmake/Imath/ImathConfig.cmake"
          PYTGT="Imath::PyImath_Python${PYVER%%.*}_${PYVER##*.}"
          {
            echo ''
            echo '# --- added by build-macalembic.yml ---'
            echo 'if(EXISTS "${CMAKE_CURRENT_LIST_DIR}/PyImathTargets.cmake")'
            echo '  include("${CMAKE_CURRENT_LIST_DIR}/PyImathTargets.cmake")'
            echo '  set(Imath_PyImath_FOUND TRUE)'
            echo "  if(TARGET Imath::PyImath AND NOT TARGET $PYTGT)"
            echo "    add_library($PYTGT INTERFACE IMPORTED)"
            echo "    set_target_properties($PYTGT PROPERTIES"
            echo '      INTERFACE_LINK_LIBRARIES Imath::PyImath)'
            echo '  endif()'
            echo 'endif()'
          } >> "$CFG"
          tail -16 "$CFG"

      - name: Alembic + PyAlembic
        run: |
          set -eux
          git clone --depth 1 --recursive -b ${{ github.event.inputs.alembic_tag }} \
            https://github.com/alembic/alembic.git
          # Stop PyAlembic linking libpython. 1.8.7 lists ${PYTHON_LIBRARIES} -
          # the full path to the framework - while master uses Python::Python,
          # the target meant for EMBEDDING an interpreter. Either way the module
          # ends up owning a second interpreter, which segfaults inside any
          # process that already has one, Blender included. Blank the variable
          # (only on its own line, so the STREQUAL fallback above keeps its
          # if/endif intact) and retarget the modern spelling.
          sed -i '' 's/^[[:space:]]*\${PYTHON_LIBRARIES}[[:space:]]*$//' \
            alembic/python/PyAlembic/CMakeLists.txt
          sed -i '' 's/Python::Python/Python::Module/' \
            alembic/python/PyAlembic/CMakeLists.txt
          sed -n '/TARGET_LINK_LIBRARIES(alembic/,/)/p' \
            alembic/python/PyAlembic/CMakeLists.txt
          cmake -S alembic -B alembic/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/boost-install;$HOME/imath-install" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DUSE_PYALEMBIC=ON -DUSE_HDF5=OFF -DUSE_TESTS=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup" \
            -DCMAKE_MODULE_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup" \
            -DBoost_NO_BOOST_CMAKE=ON -DBoost_NO_SYSTEM_PATHS=ON \
            -DBOOST_ROOT="$HOME/boost-install" \
            -DCMAKE_POLICY_DEFAULT_CMP0144=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD \
            -DBoost_ROOT="$HOME/boost-install" \
            -DBoost_PYTHON_VERSION="${PYVER}" \
            -DImath_ROOT="$HOME/imath-install" \
            -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew \
            -DPython_EXECUTABLE="$PY_BIN" -DPython3_EXECUTABLE="$PY_BIN" \
            -DPython_ROOT_DIR="$(dirname $(dirname $PY_BIN))" \
            2>&1 | tee abc-configure.log
          grep -iE "Imath|PyImath|Boost|Found Python" abc-configure.log || true
          cmake --build alembic/build -j3

      # Keep the cpython-XYZ-darwin tag on the three binding modules. Python
      # resolves it itself, so 3.11 and 3.13 can share one folder.
      # Keep the cpython-XYZ-darwin tag on the three binding modules. Python
      # resolves it itself, so 3.11 and 3.13 can share one folder.
      # This build emits plain alembic.so / imath.so / imathnumpy.so - no ABI
      # tag, despite WITH_SOABI. Two Python versions therefore collide on the
      # same three filenames, and merging them by hand is what silently dropped
      # the 3.13 modules from the shipped folder. Add the tag here: Python
      # accepts alembic.cpython-313-darwin.so as an extension module and picks
      # the matching one itself, exactly like cp311/cp313 .pyd on Windows.
      - name: Stage with an ABI tag so both versions can share a folder
        run: |
          set -eux
          echo "--- python modules produced by the builds ---"
          find "$GITHUB_WORKSPACE/alembic/build" "$HOME/imath-install" -name "*.so" | sort
          OUT="macos_${PY_SHORT}"; mkdir -p "$OUT"
          for mod in alembic imath imathnumpy; do
            # prefer an already-tagged file if a future build ever emits one
            f=$(find "$GITHUB_WORKSPACE/alembic/build" "$HOME/imath-install" \
                  -name "${mod}.cpython-${PY_SHORT}*.so" | head -1 || true)
            if [ -z "$f" ]; then
              f=$(find "$GITHUB_WORKSPACE/alembic/build" "$HOME/imath-install" \
                    -name "${mod}.so" | head -1 || true)
            fi
            if [ -n "$f" ]; then
              cp "$f" "$OUT/${mod}.cpython-${PY_SHORT}-darwin.so"
            else
              echo "note: no ${mod} module for python ${PYVER}"
            fi
          done
          find "$GITHUB_WORKSPACE/alembic/build" -name "libAlembic*.dylib" -not -type l \
            -exec cp {} "$OUT/" \;
          cp "$HOME/imath-install/lib/"libPyImath*Python*.dylib "$OUT/" 2>/dev/null || true
          cp "$HOME/imath-install/lib/"libImath*.dylib "$OUT/" 2>/dev/null || true
          cp "$HOME/boost-install/lib/libboost_python${PY_SHORT}.dylib" "$OUT/"
          # deliberately NOT copying libpython - see the note above the step
          ls -l "$OUT"
          # Without the alembic module the folder is only support libraries -
          # which is precisely the unusable state the shipped 3.13 half was in.
          test -f "$OUT/alembic.cpython-${PY_SHORT}-darwin.so"

      - name: Rewrite every dependency to @loader_path
        run: |
          set -eux
          cd "macos_${PY_SHORT}"
          for f in *.so *.dylib; do
            [ -e "$f" ] || continue
            install_name_tool -id "@loader_path/$f" "$f" || true
            # A failed test must never be the last command in the loop body:
            # with set -e that makes the whole loop exit 1 the moment a system
            # library like libc++ is not in the folder, which it never is.
            otool -L "$f" | awk 'NR>1 {print $1}' > /tmp/deps.txt
            while read -r dep; do
              case "$dep" in
                @loader_path/*) continue ;;
                *Python.framework*/Python|*libpython*)
                  echo "still links a python library: $f -> $dep" >> /tmp/pylinks.txt
                  continue ;;
              esac
              base=$(basename "$dep")
              if [ -e "$base" ]; then
                install_name_tool -change "$dep" "@loader_path/$base" "$f"
              fi
            done < /tmp/deps.txt
          done
          rm -f /tmp/deps.txt
          codesign --force -s - *.so *.dylib
          if [ -s /tmp/pylinks.txt ]; then
            echo 'FAIL: something still links a python library. Loading that'
            echo '      alongside the interpreter already in the process is what'
            echo '      segfaults - the module must resolve Python symbols from'
            echo '      the host instead.'
            cat /tmp/pylinks.txt
            exit 1
          fi

      - name: Import it the way the add-on does
        run: |
          set -eu
          cd "macos_${PY_SHORT}"
          for f in *.so; do echo "[$f]"; otool -L "$f" | tail -n +2; done
          python - <<'PY'
          import importlib, os, sys
          sys.path.insert(0, os.getcwd())
          Abc  = importlib.import_module("alembic.Abc")
          Geom = importlib.import_module("alembic.AbcGeom")
          im   = importlib.import_module("imath")
          arch = Abc.OArchive("smoke.abc")
          xf   = Geom.OXform(arch.getTop(), "Groom_Root")
          cur  = Geom.OCurves(xf, "Hair_Curves")
          del cur, xf, arch
          print("OK", sys.version.split()[0], os.path.getsize("smoke.abc"), "bytes")
          PY
          rm -f smoke.abc

      - uses: actions/upload-artifact@v4
        with:
          name: macos_${{ env.PY_SHORT }}
          path: macos_${{ env.PY_SHORT }}

  merge:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts }

      - name: Merge into one macalembic/ and check it is self-contained
        run: |
          set -eux
          mkdir -p macalembic
          # Shared, Python-independent libraries are identical between the two
          # builds, so either copy will do. The ABI-tagged modules and the
          # per-version dylibs all have distinct names and simply coexist.
          cp -n parts/*/* macalembic/
          cd macalembic
          ls -l
          echo "--- one binding module per Python version must be present ---"
          for tag in 311 313; do
            for mod in alembic imath imathnumpy; do
              if [ ! -f "${mod}.cpython-${tag}-darwin.so" ]; then
                echo "FAIL: ${mod} missing for python 3.${tag#3}"; exit 1
              fi
            done
          done
          echo "--- nothing may point outside the folder ---"
          if otool -L *.so *.dylib | grep -E '^[[:space:]]+(/opt|/usr/local|/Users|@rpath)'; then
            echo "FAIL: build-machine path survived"; exit 1
          fi
          for f in *.so *.dylib; do printf '%-46s ' "$f"; lipo -archs "$f"; done
          echo "OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macalembic
          path: macalembic
