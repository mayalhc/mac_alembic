name: Build PyAlembic for macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-macos:
    # macOS 최신 버전 환경 선택
    runs-on: macos-latest

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.13 설정
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # 프리-스레딩(GIL 해제) 버전이 필요하다면 '3.13t' 사용

      # 3. 필수 의존성 및 도구 설치
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      # 4. PyAlembic 빌드 수행
      # (참고하신 저장소의 실제 빌드 명령어를 적어주세요)
      - name: Build Wheel
        run: |
          python -m build
          # 또는 특정 스크립트 실행: python setup.py bdist_wheel

      # 5. 빌드된 결과물(Wheel 파일 등) 저장
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-python3.13-build
          path: dist/ # 빌드 파일이 생성되는 경로
