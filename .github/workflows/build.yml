name: PyAlembic 3.13 Ultimate Static Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout All Sources
        run: |
          # ✅ 올바른 실제 repo 주소로 수정
          git clone --depth 1 https://github.com/alembic/alembic.git ${GITHUB_WORKSPACE}/alembic
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git ${GITHUB_WORKSPACE}/imath
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openexr.git ${GITHUB_WORKSPACE}/openexr

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install System Tools
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: 1. Build Imath (Static)
        run: |
          cd ${GITHUB_WORKSPACE}/imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/deps \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(sysctl -n hw.ncpu) install

      - name: 2. Build PyImath (Source Integration)
        run: |
          cd ${GITHUB_WORKSPACE}/openexr
          mkdir build && cd build
          PY_EXE=$(which python3)
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/deps \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPENEXR_FORCE_INTERNAL_IMATH=OFF \
            -DImath_DIR=${GITHUB_WORKSPACE}/deps/lib/cmake/Imath \
            -DPYIMATH_ENABLE=ON \
            -DPYTHON_EXECUTABLE=$PY_EXE \
            -DBoost_PYTHON_LIBRARY_RELEASE=$(find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib" | head -n 1)
          make -j$(sysctl -n hw.ncpu) install

      - name: 3. Build Alembic (Ultimate Link)
        run: |
          cd ${GITHUB_WORKSPACE}/alembic
          mkdir -p build && cd build
          
          PY_PREFIX=$(python3 -c "import sys; print(sys.prefix)")
          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib" | head -n 1)
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=OFF \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=${GITHUB_WORKSPACE}/deps/lib/cmake/Imath \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/deps;$(brew --prefix boost-python3)"
          
          make -j$(sysctl -n hw.ncpu) install

      - name: 4. Final Package Collection
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/final_out/alembic
          find ${GITHUB_WORKSPACE}/dist -name "*.so" -exec cp {} ${GITHUB_WORKSPACE}/final_out/alembic/ \;
          cp -r ${GITHUB_WORKSPACE}/alembic/python/PyAlembic/* ${GITHUB_WORKSPACE}/final_out/alembic/ || true
          
          mkdir -p ${GITHUB_WORKSPACE}/final_out/libs
          find ${GITHUB_WORKSPACE}/deps/lib -name "*.dylib" -exec cp {} ${GITHUB_WORKSPACE}/final_out/libs/ \; || true
          cp $(find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib" | head -n 1) ${GITHUB_WORKSPACE}/final_out/libs/ || true
          cp $(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")/libpython3.13.dylib ${GITHUB_WORKSPACE}/final_out/libs/ || true

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-3.13-Ultimate-Package
          path: ${{ github.workspace }}/final_out/
