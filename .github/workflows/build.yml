name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      # 1. 빌드용 소스 코드 직접 가져오기
      - name: Clone PyAlembic Source
        run: |
          # 기존 폴더가 있다면 삭제하고 새로 받음
          rm -rf build_dir
          git clone https://github.com/mayalhc/mac_alembic build_dir

      # 2. 빌드 실행 (working-directory 설정을 사용하여 경로 강제 지정)
      - name: Build Wheel
        working-directory: ./build_dir
        run: |
          # 라이브러리 경로 설정
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          
          # 현재 폴더에 무엇이 있는지 확인 (로그에 남음)
          ls -F
          
          # 빌드 명령어 (경로 오류를 방지하기 위해 파일 이름을 명시)
          python3 ./setup.py bdist_wheel

      # 3. 결과물 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          path: build_dir/dist/*.whl
