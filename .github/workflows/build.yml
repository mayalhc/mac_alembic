name: PyAlembic 3.13 Final Stand (Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Alembic
        uses: actions/checkout@v4
        with:
          repository: alembic/alembic
          path: alembic

      - name: Checkout Imath
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/Imath
          path: imath

      - name: Checkout OpenEXR (PyImath source)
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/openexr
          path: pyimath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: Build Everything
        run: |
          export ROOT=$GITHUB_WORKSPACE
          export PREFIX=$ROOT/deploy
          mkdir -p $PREFIX

          # 1️⃣ Imath
          cd $ROOT/imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)
          make install

          # 2️⃣ PyImath (OpenEXR 내부 경로)
          cd $ROOT/pyimath/src/wrappers/python
          mkdir build && cd build

          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1)

          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DImath_DIR=$PREFIX/lib/cmake/Imath \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON

          make -j$(sysctl -n hw.ncpu)
          make install || true

          # 3️⃣ Alembic
          cd $ROOT/alembic
          mkdir build && cd build

          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=$PREFIX/lib/cmake/Imath \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_PREFIX_PATH="$PREFIX;$(brew --prefix boost-python3)"

          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Package Result
        run: |
          mkdir -p publish/alembic
          mkdir -p publish/libs

          # .so 파일
          find ${{ github.workspace }}/deploy -name "*.so" -exec cp {} publish/alembic/ \; || true

          # PyAlembic python wrapper
          cp -r ${{ github.workspace }}/alembic/python/PyAlembic/* publish/alembic/ || true

          # dylib 모음
          find ${{ github.workspace }}/deploy/lib -name "*.dylib" -exec cp {} publish/libs/ \; || true

          # boost python
          cp $(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1) publish/libs/ || true

          # python dylib
          cp $(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")/libpython3.13.dylib publish/libs/ || true

          echo "--- FINAL ---"
          ls -R publish/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-3.13-Final
          path: publish/
