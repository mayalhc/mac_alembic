name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      # 충돌을 피하기 위해 'build_dir'이라는 새 폴더에 소스를 받습니다.
      - name: Clone and Build
        run: |
          # 1. 소스 가져오기
          git clone https://github.com/mayalhc/mac_alembic build_dir
          cd build_dir
          
          # 2. 라이브러리 경로 설정
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          
          # 3. 빌드 실행
          python3 setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          # 빌드된 파일 위치 지정
          path: build_dir/dist/*.whl
