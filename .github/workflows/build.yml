name: PyAlembic 3.13 Stable Build (Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Alembic
        uses: actions/checkout@v4
        with:
          repository: alembic/alembic
          path: alembic

      - name: Checkout Imath
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/Imath
          path: imath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      # =========================
      # 1. IMATH (PYTHON 절대 끔)
      # =========================
      - name: Build Imath (NO PyImath)
        run: |
          cd imath
          mkdir -p build && cd build

          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deploy \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYIMATH_ENABLE=OFF

          make -j$(sysctl -n hw.ncpu) install

      # =========================
      # 2. ALEMBIC
      # =========================
      - name: Build Alembic
        run: |
          cd alembic
          mkdir -p build && cd build

          PY_EXE=$(which python3)
          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1)

          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deploy \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$PY_EXE \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deploy;$(brew --prefix boost-python3)"

          make -j$(sysctl -n hw.ncpu) install

      # =========================
      # 3. OUTPUT ONLY
      # =========================
      - name: Package
        run: |
          mkdir -p publish/PyAlembic

          find $GITHUB_WORKSPACE/deploy -name "*.so" -exec cp {} publish/PyAlembic/ \;

          mkdir -p publish/libs
          find $GITHUB_WORKSPACE/deploy -name "*.dylib" -exec cp {} publish/libs/ \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-3.13-Fixed
          path: publish/
