name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 버튼을 눌러 수동으로 실행 가능

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1. 현재 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.13 설치
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. macOS 필수 라이브러리 및 빌드 도구 설치
      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      # 4. PyAlembic 소스 코드 가져오기 및 빌드
      - name: Clone PyAlembic and Build
        run: |
          # 소스를 'py_src' 폴더에 명확히 다운로드
          git clone https://github.com py_src
          cd py_src

          # macOS 환경에서 brew로 설치된 라이브러리 경로 인식 설정
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          
          # 빌드 실행
          python3 setup.py bdist_wheel

      # 5. 빌드 완료된 .whl 파일을 GitHub Actions 결과물로 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          # 빌드된 파일 위치 (py_src 내부의 dist 폴더)
          path: py_src/dist/*.whl
