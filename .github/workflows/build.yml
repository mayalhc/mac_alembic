name: Extract Py3.13 Core Libraries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Sources
        run: |
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone https://github.com/mayalhc/mac_alembic.git myrepo

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost boost-python3
          python3 -m pip install numpy

      - name: Build Imath for Python 3.13
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYIMATH_ENABLE=ON \
            -DPYTHON_EXECUTABLE=$(which python3)
          make -j$(sysctl -n hw.ncpu) install

      - name: Collect Target Libraries (3.13)
        run: |
          mkdir -p output_313
          
          # 1. PyImath
          find $GITHUB_WORKSPACE/dist/lib -name "libPyImath_Python3_13*.dylib" -exec cp {} output_313/ \;

          # 2. boost python
          cp $(find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib") output_313/ || true
          
          # 3. python dylib
          PY_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cp $PY_LIB_DIR/libpython3.13.dylib output_313/

          # 🔥 추가: 네 PyAlembic 코드도 같이 포함
          mkdir -p output_313/PyAlembic
          cp -r myrepo/PyAlembic/* output_313/PyAlembic/ || true

      - name: Check Extracted Files
        run: ls -l output_313/

      - name: Upload Core Libraries
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Required-Libs-3.13
          path: output_313/
