name: Build PyAlembic 3.13 (Boost Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        run: |
          git clone https://github.com/alembic/alembic.git
          git clone https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone https://github.com/mayalhc/mac_alembic.git myrepo

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: Build Imath
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DPYIMATH_ENABLE=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install

      - name: Build Alembic (Force Boost Python 3.13)
        run: |
          cd alembic
          mkdir build && cd build
          
          PY_PREFIX=$(python3 -c "import sys; print(sys.prefix)")
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DPYTHON_INCLUDE_DIR=${PY_PREFIX}/include/python3.13 \
            -DPYTHON_LIBRARY=${PY_PREFIX}/lib/libpython3.13.dylib \
            -DImath_DIR=$GITHUB_WORKSPACE/dist/lib/cmake/Imath \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_ARCHITECTURE=-x64 \
            -DBOOST_LIBRARYDIR=$(brew --prefix boost-python3)/lib \
            -DBoost_PYTHON_LIBRARY_RELEASE=$(find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib") \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dist;$(brew --prefix boost-python3)" \
            -DCMAKE_BUILD_TYPE=Release
          
          make -j$(sysctl -n hw.ncpu) install

      - name: Organize Artifacts
        run: |
          mkdir -p output/alembic
          mkdir -p output/libs
          # 빌드된 바이너리 및 dylib 수집
          find $GITHUB_WORKSPACE/dist -name "*.so" -exec cp {} output/alembic/ \;
          cp $GITHUB_WORKSPACE/dist/lib/*.dylib output/libs/
          # 필요한 경우 boost-python dylib도 포함
          cp $(brew --prefix boost-python3)/lib/libboost_python313*.dylib output/libs/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-3.13-Final
          path: output/
