name: PyAlembic 3.13 Final Stand (Force Integration)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    permissions:
      contents: write   # 🔥 이거 없으면 push 403 난다

    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4

      - name: Clone Dependencies
        run: |
          git clone --depth 1 https://github.com/alembic/alembic.git
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openexr.git pyimath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3 pybind11
          python3 -m pip install numpy

      - name: Build Everything
        run: |
          export ROOT=$GITHUB_WORKSPACE
          export PREFIX=$ROOT/deploy
          mkdir -p $PREFIX
          
          # 1. Imath
          cd imath && mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install
      
          # 2. PyImath (OpenEXR)
          cd $ROOT/pyimath && mkdir build && cd build
          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1)
          PYBIND11_DIR=$(brew --prefix pybind11)/share/cmake/pybind11
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release \
            -DImath_DIR=$PREFIX/lib/cmake/Imath \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DOPENEXR_BUILD_PYTHON=ON \
            -DOPENEXR_FORCE_INTERNAL_IMATH=OFF \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON \
            -Dpybind11_DIR=$PYBIND11_DIR
          make -j$(sysctl -n hw.ncpu) install
      
          # 🔥 PyImathTargets 강제 복사
          IMATH_CMAKE_DIR=$PREFIX/lib/cmake/Imath
          mkdir -p $IMATH_CMAKE_DIR
          find $PREFIX -name "PyImath*.cmake" -exec cp {} $IMATH_CMAKE_DIR/ \;
      
          # 3. Alembic
          cd $ROOT/alembic && mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=$PREFIX/lib/cmake/Imath \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_PREFIX_PATH="$PREFIX;$(brew --prefix boost-python3);$(brew --prefix pybind11)"
          make -j$(sysctl -n hw.ncpu) install

      - name: Save to Repo (🔥 핵심)
        run: |
          mkdir -p PyAlembic/alembic
          mkdir -p PyAlembic/libs
          
          # .so + .dylib 둘 다 저장
          find deploy -name "*.so" -exec cp {} PyAlembic/alembic/ \; || true
          find deploy -name "*.dylib" -exec cp {} PyAlembic/alembic/ \; || true
          
          cp -r alembic/python/PyAlembic/* PyAlembic/alembic/ || true
          
          cp deploy/lib/*.dylib PyAlembic/libs/ || true
          cp $(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1) PyAlembic/libs/ || true
          cp $(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")/libpython3.13.dylib PyAlembic/libs/ || true

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          git add PyAlembic
          git commit -m "Auto build PyAlembic 3.13" || echo "No changes"
          git push
