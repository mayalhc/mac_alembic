name: Build PyAlembic 3.13 (Ultimate Static)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout All Sources
        run: |
          # Imath와 PyImath를 각각 가져옵니다.
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openexr.git pyimath
          git clone --depth 1 https://github.com/sqlalchemy/alembic.git alembic

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install System Core
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: 1. Build Imath (Static)
        run: |
          cd imath && mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install

      - name: 2. Build PyImath (Static Binding)
        run: |
          cd pyimath && mkdir build && cd build
          # 어떤 버전의 Boost-Python이든 일단 하나를 찾습니다.
          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1)
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DBUILD_SHARED_LIBS=OFF \
            -DImath_DIR=$GITHUB_WORKSPACE/dist/lib/cmake/Imath \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON
          make -j$(sysctl -n hw.ncpu) install

      - name: 3. Build Alembic & PyAlembic (Final One-Body)
        run: |
          cd alembic && mkdir build && cd build
          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1)
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=OFF \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=$GITHUB_WORKSPACE/dist/lib/cmake/Imath \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dist;$(brew --prefix boost-python3)"
          make -j$(sysctl -n hw.ncpu) install

      - name: 4. Collect Only Working Files
        run: |
          mkdir -p final_out/alembic
          # 핵심인 alembic.so와 관련 파이썬 파일만 챙깁니다.
          find $GITHUB_WORKSPACE/dist -name "*.so" -exec cp {} final_out/alembic/ \;
          cp -r alembic/python/PyAlembic/* final_out/alembic/ || true
          
          # 런타임에 혹시나 찾을지 모르는 dylib들 (최소한만)
          mkdir -p final_out/libs
          find $GITHUB_WORKSPACE/dist/lib -name "*.dylib" -exec cp {} final_out/libs/ \; || true
          cp $(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1) final_libs/libboost_python313.dylib || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-3.13-Final-Package
          path: final_out/
