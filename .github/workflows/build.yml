name: Extract Py3.13 Core Libraries (Save to Repo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Imath
        run: git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost boost-python3
          python3 -m pip install numpy

      - name: Build Imath
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYIMATH_ENABLE=ON \
            -DPYTHON_EXECUTABLE=$(which python3)
          make -j$(sysctl -n hw.ncpu) install

      - name: Copy to your repo (PyAlembic)
        run: |
          mkdir -p PyAlembic/libs

          # 🔥 실제 존재하는 것만 복사됨
          find $GITHUB_WORKSPACE/dist/lib -name "*PyImath*.dylib" -exec cp {} PyAlembic/libs/ \; || true
          find $(brew --prefix boost-python3)/lib -name "libboost_python*.dylib" -exec cp {} PyAlembic/libs/ \;
          
          PY_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cp $PY_LIB_DIR/libpython3*.dylib PyAlembic/libs/ || true

          echo "--- RESULT ---"
          ls -l PyAlembic/libs/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add PyAlembic/libs
          git commit -m "Add Python 3.13 libs" || echo "No changes"

          git pull --rebase origin main || true
          git push origin HEAD:main || git push origin HEAD:main --force
