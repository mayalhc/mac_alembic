name: Build PyAlembic (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 🔥 3.13 말고 안정 버전으로 먼저 확인

      - name: Install deps
        run: |
          brew update
          brew install alembic boost imath cmake

          python -m pip install --upgrade pip
          python -m pip install setuptools wheel numpy

      - name: Clone repo
        run: |
          git clone https://github.com/mayalhc/mac_alembic.git
          ls -al

      - name: Build
        run: |
          cd mac_alembic/PyAlembic

          BREW_PREFIX=$(brew --prefix)

          export CFLAGS="-I$BREW_PREFIX/include"
          export LDFLAGS="-L$BREW_PREFIX/lib"
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib"

          python setup.py build_ext --inplace
          python setup.py bdist_wheel

      - name: Check output
        run: |
          ls -al mac_alembic/PyAlembic/dist
