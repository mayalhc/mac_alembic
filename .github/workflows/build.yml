name: Build Alembic Python (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew update
          brew install boost boost-python3 imath hdf5 cmake

          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Clone Alembic
        run: |
          git clone https://github.com/alembic/alembic.git

      - name: Patch Imath (🔥 핵심)
        run: |
          BREW_PREFIX=$(brew --prefix)

          mkdir -p $BREW_PREFIX/lib/cmake/Imath

          # 가짜 PyImathTargets.cmake 생성
          echo "add_library(PyImath INTERFACE)" > $BREW_PREFIX/lib/cmake/Imath/PyImathTargets.cmake

      - name: Build Alembic
        run: |
          cd alembic
          mkdir build
          cd build

          BREW_PREFIX=$(brew --prefix)

          cmake .. \
            -DUSE_PYALEMBIC=ON \
            -DPYTHON_EXECUTABLE=$(which python) \
            -DBOOST_ROOT=$BREW_PREFIX \
            -DBoost_PYTHON_LIBRARY=$BREW_PREFIX/lib \
            -DCMAKE_BUILD_TYPE=Release

          make -j4

      - name: Check result
        run: |
          ls -al alembic/build/lib || true
