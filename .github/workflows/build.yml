name: Build PyAlembic for macOS (Python 3.13)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Alembic Source
        uses: actions/checkout@v4
        with:
          repository: alembic/alembic
          path: alembic

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies (Homebrew)
        run: |
          brew update
          # Imath, HDF5, Boost 설치
          brew install cmake hdf5 imath boost boost-python3
          
          # PyImath 이슈 해결을 위해 PyIlmBase(PyImath) 관련 경로 확인 및 pip 설치
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install numpy

      - name: Configure and Build
        run: |
          mkdir build && cd build
          
          # 주요 경로 변수 설정
          export PREFIX=$(brew --prefix)
          export PYTHON_EXE=$(which python3)
          
          cmake ../alembic \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$PYTHON_EXE \
            -DIMATH_INSTALL_PREFIX=$PREFIX \
            -DIMATH_INC_DIR=$PREFIX/include/Imath \
            -DIMATH_LIB_DIR=$PREFIX/lib \
            -DBOOST_ROOT=$PREFIX \
            -DPYIMATH_LIBRARIES=$PREFIX/lib/libPyImath_Python3_13.dylib \
            -DALE_PYIMATH_PYTHON3=ON \
            -DCMAKE_MACOSX_RPATH=ON
          
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Organize Python Artifacts
        run: |
          mkdir -p final_output/alembic
          # 빌드된 .so 파일들을 패키지 형태로 모음
          find build/python -name "*.so" -exec cp {} final_output/alembic/ \; || true
          # alembic 내의 python 소스 파일들도 복사
          cp -r alembic/python/PyAlembic/* final_output/alembic/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-Python3.13
          path: final_output/
