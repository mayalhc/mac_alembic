name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

       - name: Clone and Build
        run: |
          # 1. 레포 클론
          git clone https://github.com/mayalhc/mac_alembic.git source_dir
          cd source_dir
      
          # 2. PyAlembic 폴더로 이동 (이거 안 하면 100% 실패)
          cd PyAlembic
      
          # 3. brew 경로 설정 (macOS runner 기준)
          export BREW_PREFIX=$(brew --prefix)
          export CPLUS_INCLUDE_PATH=$BREW_PREFIX/include
          export LIBRARY_PATH=$BREW_PREFIX/lib
          export DYLD_LIBRARY_PATH=$BREW_PREFIX/lib
      
          # 4. 필수 패키지 설치
          python3 -m pip install --upgrade pip setuptools wheel
      
          # 5. 빌드 실행
          python3 setup.py bdist_wheel
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          path: source_dir/PyAlembic/dist/*.whl
