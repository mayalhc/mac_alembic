name: Build Alembic Python (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          brew update
          brew install boost boost-python3 imath hdf5 cmake
          python -m pip install --upgrade pip numpy

      - name: Clone Alembic
        run: git clone https://github.com/alembic/alembic.git

      - name: Patch Imath
        run: |
          BREW_PREFIX=$(brew --prefix)
          mkdir -p $BREW_PREFIX/lib/cmake/Imath
          echo "add_library(Imath::PyImath INTERFACE IMPORTED)" > $BREW_PREFIX/lib/cmake/Imath/PyImathTargets.cmake

      - name: Build
        run: |
          cd alembic
          mkdir build
          cd build

          BREW_PREFIX=$(brew --prefix)

          cmake .. \
            -DUSE_PYALEMBIC=ON \
            -DPython3_EXECUTABLE=$(which python) \
            -DBOOST_ROOT=$BREW_PREFIX \
            -DBoost_PYTHON_LIBRARY=$BREW_PREFIX/lib \
            -DCMAKE_BUILD_TYPE=Release

          make -j4

      - name: Check
        run: ls -al alembic/build/lib || true
