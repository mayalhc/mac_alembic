name: Build PyAlembic for macOS (Python 3.11)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        run: |
          git clone https://github.com/alembic/alembic.git
          git clone https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone https://github.com/mayalhc/mac_alembic.git myrepo

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: Build Imath (Python 3.11 Binding)
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deps \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DPYIMATH_ENABLE=ON \
            -DIMATH_INSTALL_PKGCONFIGDIR=$GITHUB_WORKSPACE/deps/lib/pkgconfig
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Build Alembic (PyAlembic)
        run: |
          cd alembic
          mkdir build && cd build
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=$GITHUB_WORKSPACE/deps/lib/cmake/Imath \
            -DIMATH_INC_DIR=$GITHUB_WORKSPACE/deps/include/Imath \
            -DIMATH_LIB_DIR=$GITHUB_WORKSPACE/deps/lib \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps;$(brew --prefix boost-python3)"
          
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Collect Artifacts
        run: |
          mkdir -p final_output/alembic
          mkdir -p final_output/libs

          # 네 PyAlembic 코드 포함
          cp -r myrepo/PyAlembic/* final_output/alembic/ || true

          # 빌드된 .so
          find alembic/build -name "*.so" -exec cp {} final_output/alembic/ \; || true

          # dylib
          find $GITHUB_WORKSPACE/deps/lib -name "*.dylib" -exec cp {} final_output/libs/ \; || true

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-Py3.11
          path: final_output/
