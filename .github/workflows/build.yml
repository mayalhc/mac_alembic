name: Build PyAlembic for macOS (Python 3.13)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout PyAlembic repository
        uses: actions/checkout@v4
        with:
          repository: alembic/alembic
          path: alembic

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies (Homebrew)
        run: |
          brew update
          brew install cmake hdf5 imath boost boost-python3
          # Python 3.13 경로 확인을 위해 pip 설치 확인
          python3 -m pip install --upgrade pip setuptools

      - name: Configure and Build
        run: |
          mkdir build && cd build
          # CMake 설정: USE_PYALEMBIC 활성화 및 Python 3.13 경로 지정
          cmake ../alembic \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DALEMBIC_SHARED_LIBS=ON \
            -DILMBASE_INC_DIR=$(brew --prefix imath)/include/Imath \
            -DIMATH_INC_DIR=$(brew --prefix imath)/include/Imath \
            -DIMATH_LIB_DIR=$(brew --prefix imath)/lib
          
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Organize Python Artifacts
        run: |
          mkdir -p final_output/alembic
          # 빌드된 .so 또는 .dylib 파일을 Python에서 임포트 가능하도록 정리
          find build/python -name "*.so" -exec cp {} final_output/alembic/ \; || true
          find build/python -name "*.dylib" -exec cp {} final_output/alembic/ \; || true
          # 필요한 경우 __init__.py 등 추가 소스 복사 (alembic 소스 내 위치 확인 필요)
          cp -r alembic/python/PyAlembic/* final_output/alembic/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-Python3.13
          path: final_output/
