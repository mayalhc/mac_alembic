name: Build PyAlembic (macOS)

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1. 내 저장소의 파일을 가져옵니다 (이미 PyAlembic 폴더가 포함됨)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          brew install alembic boost imath cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel numpy

      # 4. 빌드 실행 (경로 수정: 내 저장소 안의 PyAlembic 폴더로 이동)
      - name: Build PyAlembic
        run: |
          # 이미 체크아웃을 했으므로 바로 폴더로 들어갑니다.
          cd PyAlembic

          BREW_PREFIX=$(brew --prefix)
          export CFLAGS="-I$BREW_PREFIX/include"
          export LDFLAGS="-L$BREW_PREFIX/lib"
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib"

          # 빌드 수행
          python setup.py bdist_wheel

      # 5. 아티팩트 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-wheel
          # 경로를 실제 파일이 생성된 위치에 맞게 수정
          path: PyAlembic/dist/*.whl
