name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      - name: Clone and Build
        run: |
          # 1. 원본 소스 주소를 정확하게 입력 (옵션 도움말이 뜨지 않도록 주소만 명시)
          git clone https://github.com/mayalhc/PyAlembic.git source_dir
          
          # 2. 폴더 이동
          cd source_dir
          
          # 3. 라이브러리 경로 설정
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          
          # 4. 빌드 실행
          python3 setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          path: source_dir/dist/*.whl
