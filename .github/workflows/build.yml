name: Extract Only 3 Core Libs (3.13)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source (For Imath/PyImath)
        run: |
          # Imath와 PyImath를 각각 가져옵니다.
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openexr.git pyimath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install System Dependencies
        run: |
          brew update
          brew install cmake boost boost-python3

      - name: Build libPyImath (1st File)
        run: |
          # Imath 엔진 빌드
          cd imath && mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install
          
          # PyImath 바인딩 빌드 (libPyImath_Python3_13 생성)
          cd ../../pyimath && mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DImath_DIR=$GITHUB_WORKSPACE/dist/lib/cmake/Imath \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DBOOST_ROOT=$(brew --prefix boost)
          make -j$(sysctl -n hw.ncpu) install

      - name: Collect 3 Core Files (The Target)
        run: |
          mkdir -p final_libs
          
          # 1. libPyImath_Python3_13-3_1.dylib (직접 빌드한 것)
          find $GITHUB_WORKSPACE/dist/lib -name "libPyImath_Python3_13*.dylib" -exec cp {} final_libs/ \;
          
          # 2. libboost_python313.dylib (시스템에서 추출)
          find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib" -type f -exec cp {} final_libs/ \;
          
          # 3. libpython3.13.dylib (환경에서 복사)
          PY_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cp $PY_LIB_DIR/libpython3.13.dylib final_libs/
          
          echo "--- CHECKING FINAL FILES ---"
          ls -l final_libs/

      - name: Upload Core 3 Libs
        uses: actions/upload-artifact@v4
        with:
          name: Core-Libs-3.13-Set
          path: final_libs/
