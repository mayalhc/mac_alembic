name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      # 현재 폴더를 비우고 외부 소스를 새로 가져와서 바로 빌드
      - name: Clone and Build
        run: |
          # 1. 혹시 있을지 모를 기존 파일 삭제
          rm -rf *
          # 2. 원본 소스를 현재 위치(.)에 클론
          git clone https://github.com/mayalhc/mac_alembic .
          
          # 3. 라이브러리 경로 설정
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          
          # 4. 빌드 실행
          python3 setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          path: dist/*.whl
