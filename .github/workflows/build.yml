name: Extract Py3.13 Core Libraries (Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout your repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔥 중요 (충돌 방지)

      - name: Sync with remote (latest)
        run: |
          git pull origin main || true

      - name: Clone Imath
        run: git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost boost-python3

      - name: Build Imath
        run: |
          cd imath
          mkdir build && cd build
      
          PY_INC=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['include'])")
      
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYIMATH_ENABLE=ON \
            -DPython3_EXECUTABLE=$(which python3) \
            -DPYTHON_INCLUDE_DIR=$PY_INC
      
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Copy libs into repo
        run: |
          mkdir -p PyAlembic/libs

          # PyImath
          cp $GITHUB_WORKSPACE/dist/lib/*PyImath*.dylib PyAlembic/libs/ || true

          # boost python
          find $(brew --prefix boost-python3)/lib -name "libboost_python*.dylib" -exec cp {} PyAlembic/libs/ \;

          # python dylib
          PY_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cp $PY_LIB_DIR/libpython3*.dylib PyAlembic/libs/ || true

          ls -l PyAlembic/libs/

      - name: Commit & Push (conflict-safe)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add PyAlembic/libs
          git commit -m "Add Python 3.13 core libs" || echo "No changes"

          # 🔥 충돌 무조건 해결
          git pull --rebase origin main || true

          # 🔥 그래도 막히면 강제 push
          git push origin HEAD:main || git push origin HEAD:main --force
