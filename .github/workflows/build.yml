name: Build PyAlembic (macOS)

on:
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1. 내 저장소의 소스 코드를 가져옴 (이미 PyAlembic 폴더가 들어있음)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.13 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. 필수 의존성 및 빌드 도구 설치
      - name: Install dependencies
        run: |
          brew install alembic boost imath cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel numpy

      # 4. 빌드 실행 (working-directory를 사용하여 경로 오류 원천 차단)
      - name: Build PyAlembic
        working-directory: ./PyAlembic
        run: |
          # 라이브러리 경로 설정
          BREW_PREFIX=$(brew --prefix)
          export CFLAGS="-I$BREW_PREFIX/include"
          export LDFLAGS="-L$BREW_PREFIX/lib"
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib"

          # 파일 확인 (로그에 setup.py가 보여야 성공)
          ls -F

          # 빌드 및 휠 생성
          python3 setup.py bdist_wheel

      # 5. 빌드 결과물 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-Python3.13
          # 생성된 파일 위치 지정
          path: PyAlembic/dist/*.whl
