name: PyAlembic 3.13 Final Stand (Path Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Alembic
        uses: actions/checkout@v4
        with:
          repository: alembic/alembic
          path: alembic

      - name: Checkout Imath
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/Imath
          path: imath

      - name: Checkout PyImath
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/PyImath
          path: pyimath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: Build Everything (Using Absolute Paths)
        run: |
          export ROOT=$GITHUB_WORKSPACE
          export PREFIX=$ROOT/deploy
          mkdir -p $PREFIX
          
          # 1. Imath (Static)
          cd $ROOT/imath && mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install

          # 2. PyImath (Static)
          cd $ROOT/pyimath && mkdir build && cd build
          BOOST_PY_LIB=$(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1)
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DBUILD_SHARED_LIBS=OFF \
            -DImath_DIR=$PREFIX/lib/cmake/Imath \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON
          make -j$(sysctl -n hw.ncpu) install

          # 3. Alembic & PyAlembic (The Final Goal)
          cd $ROOT/alembic && mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=OFF \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=$PREFIX/lib/cmake/Imath \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_PREFIX_PATH="$PREFIX;$(brew --prefix boost-python3)"
          make -j$(sysctl -n hw.ncpu) install

      - name: Package Final Result
        run: |
          mkdir -p publish/alembic
          find ${{ github.workspace }}/deploy -name "*.so" -exec cp {} publish/alembic/ \;
          cp -r ${{ github.workspace }}/alembic/python/PyAlembic/* publish/alembic/ || true
          
          mkdir -p publish/libs
          cp ${{ github.workspace }}/deploy/lib/*.dylib publish/libs/ || true
          cp $(find $(brew --prefix boost-python3)/lib -name "libboost_python3*.dylib" | head -n 1) publish/libs/libboost_python313.dylib || true
          cp $(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")/libpython3.13.dylib publish/libs/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-3.13-Final-Result
          path: publish/
