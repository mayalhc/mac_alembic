name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        # 3.13 정식 버전을 사용하도록 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      - name: Clone and Build
        run: |
          # 1. 빌드용 소스 코드를 다른 폴더에 받습니다 (충돌 방지)
          git clone https://github.com/mayalhc/mac_alembic/tree/main/PyAlembic source_dir
          cd source_dir
          
          # 2. 라이브러리 경로 설정
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          
          # 3. 빌드 실행
          python3 setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          # 생성된 .whl 파일 경로 지정
          path: source_dir/dist/*.whl
