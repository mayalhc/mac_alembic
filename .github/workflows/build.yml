name: Build PyAlembic for macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-macos:
    # macOS 최신 버전 환경 선택
    runs-on: macos-latest

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.13 설정
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # 프리-스레딩(GIL 해제) 버전이 필요하다면 '3.13t' 사용

      # 3. 필수 의존성 및 도구 설치
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      # 4. 소스 코드 가져오기 및 환경 설정 (수정된 부분)
      - name: Clone PyAlembic and Build
        run: |
          # 1. 빌드에 필요한 추가 라이브러리 설치 (macOS용)
          brew install alembic boost cmake

          # 2. PyAlembic 소스 가져오기 (본인 저장소에 소스가 없다면 직접 clone)
          # 만약 이미 소스를 포함하고 있다면 이 줄은 건너뛰세요.
          git clone https://github.com/mayalhc/mac_alembic
          cd PyAlembic

          # 3. 환경 변수 설정 (Python 3.13 경로 지정)
          export PYTHON_EXECUTABLE=$(which python3)
          
          # 4. 빌드 실행
          python3 setup.py bdist_wheel
