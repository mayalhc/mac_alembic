name: Build Alembic Python (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew update
          brew install boost imath hdf5 cmake

          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Clone Alembic
        run: |
          git clone https://github.com/alembic/alembic.git

      - name: Build Alembic with Python bindings
        run: |
          cd alembic
          mkdir build
          cd build

          cmake .. \
            -DUSE_PYALEMBIC=ON \
            -DPYTHON_EXECUTABLE=$(which python) \
            -DCMAKE_BUILD_TYPE=Release

          make -j4

      - name: Check result
        run: |
          ls -al alembic/build/lib || true
