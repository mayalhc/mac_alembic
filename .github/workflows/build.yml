name: Build PyAlembic for macOS (Python 3.13)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        run: |
          git clone https://github.com alembic
          git clone https://github.com imath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: Build and Install Imath (with PyImath)
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deps \
            -DIMATH_INSTALL_PKGCONFIGDIR=$GITHUB_WORKSPACE/deps/lib/pkgconfig \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DPYIMATH_ENABLE=ON \
            -DIMATH_HALF_USE_LOOKUP_TABLE=ON
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Build Alembic (PyAlembic)
        run: |
          cd alembic
          mkdir build && cd build
          
          # Imath 경로를 위에서 빌드한 deps 폴더로 강제 지정
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DImath_DIR=$GITHUB_WORKSPACE/deps/lib/cmake/Imath \
            -DIMATH_INC_DIR=$GITHUB_WORKSPACE/deps/include/Imath \
            -DIMATH_LIB_DIR=$GITHUB_WORKSPACE/deps/lib \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps;$(brew --prefix boost-python3)"
          
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Organize Artifacts
        run: |
          mkdir -p final_output/alembic
          # 빌드된 .so 라이브러리 수집
          find alembic/build/python -name "*.so" -exec cp {} final_output/alembic/ \; || true
          # 파이썬 래퍼 소스 복사
          cp -r alembic/python/PyAlembic/* final_output/alembic/ || true
          # 의존성 라이브러리(dylib)도 함께 포함 (런타임 에러 방지)
          mkdir -p final_output/libs
          find $GITHUB_WORKSPACE/deps/lib -name "*.dylib" -exec cp {} final_output/libs/ \; || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-Py3.13-Final
          path: final_output/
