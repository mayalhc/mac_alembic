name: Extract Py3.13 Core Libraries (Save to Repo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Clone Imath
        run: git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost boost-python3

      - name: Build Imath
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DPYIMATH_ENABLE=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install

      - name: Copy libs into your repo (PyAlembic)
        run: |
          mkdir -p PyAlembic/libs

          # PyImath
          cp $GITHUB_WORKSPACE/dist/lib/*PyImath*.dylib PyAlembic/libs/ || true

          # boost python
          find $(brew --prefix boost-python3)/lib -name "libboost_python*.dylib" -exec cp {} PyAlembic/libs/ \;

          # python dylib
          PY_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cp $PY_LIB_DIR/libpython3*.dylib PyAlembic/libs/ || true

          echo "--- PyAlembic/libs ---"
          ls -l PyAlembic/libs/

      - name: Commit and push to your repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add PyAlembic/libs
          git commit -m "Add Python 3.13 core libs" || echo "No changes"
          git push
