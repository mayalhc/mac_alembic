name: Build PyAlembic (macOS)

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1. 기본 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python (안정 버전으로 먼저 성공 확보)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          brew update
          brew install alembic boost imath cmake

          python -m pip install --upgrade pip
          python -m pip install setuptools wheel numpy

      # 4. 레포 클론
      - name: Clone PyAlembic source
        run: |
          git clone https://github.com/mayalhc/mac_alembic.git
          ls -al

      # 5. 빌드
      - name: Build PyAlembic
        run: |
          cd mac_alembic/PyAlembic

          BREW_PREFIX=$(brew --prefix)

          export CFLAGS="-I$BREW_PREFIX/include"
          export LDFLAGS="-L$BREW_PREFIX/lib"
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib"

          # 빌드 (로그 잘 보이게 단계 분리)
          python setup.py build_ext --inplace
          python setup.py bdist_wheel

      # 6. 결과 확인
      - name: Verify build output
        run: |
          ls -al mac_alembic/PyAlembic/dist || echo "No dist folder"

      # 7. 아티팩트 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-wheel
          path: mac_alembic/PyAlembic/dist/*.whl
