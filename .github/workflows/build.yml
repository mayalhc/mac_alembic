name: Extract Py3.13 Core Libraries (PyImath Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Imath and PyImath
        run: |
          # Imath와 PyImath를 각각 가져옵니다.
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openexr.git pyimath

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost boost-python3
          python3 -m pip install numpy

      - name: Build Imath
        run: |
          cd imath
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install

      - name: Build PyImath (Python 3.13 Only)
        run: |
          cd pyimath
          mkdir build && cd build
          
          # 파이썬 3.13 경로 정보 추출
          PY_EXE=$(which python3)
          PY_INC=$(python3 -c "import sysconfig; print(sysconfig.get_path('include'))")
          PY_LIB=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")/libpython3.13.dylib
          
          # CMake가 3.14를 못 찾게 하고 3.13을 강제 지정
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DImath_DIR=$GITHUB_WORKSPACE/dist/lib/cmake/Imath \
            -DPython3_EXECUTABLE=$PY_EXE \
            -DPython3_INCLUDE_DIR=$PY_INC \
            -DPython3_LIBRARY=$PY_LIB \
            -DPYTHON_EXECUTABLE=$PY_EXE \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_PYTHON_LIBRARY_RELEASE=$(find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib")
          make -j$(sysctl -n hw.ncpu) install

      - name: Collect 3.13 Core Files
        run: |
          mkdir -p output_313
          
          # 1. libPyImath_Python3_13 추출
          find $GITHUB_WORKSPACE/dist/lib -name "libPyImath_Python3_13*.dylib" -exec cp {} output_313/ \;
          
          # 2. libboost_python313 추출
          find $(brew --prefix boost-python3)/lib -name "libboost_python313*.dylib" -type f -exec cp {} output_313/ \;
          
          # 3. libpython3.13.dylib 추출
          PY_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cp $PY_LIB_DIR/libpython3.13.dylib output_313/
          
          echo "--- FINAL FILE LIST ---"
          ls -l output_313/

      - name: Upload Core Libraries
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Required-Libs-3.13
          path: output_313/
