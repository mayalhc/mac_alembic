name: Build PyAlembic for Python 3.13 (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          brew install alembic boost cmake
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      # 1. 소스를 현재 폴더(.)에 바로 클론하여 경로 복잡성을 제거합니다.
      - name: Clone PyAlembic
        run: |
          git clone https://github.com/mayalhc/mac_alembic .
          ls -F # 파일이 제대로 들어왔는지 로그 확인용

      # 2. 현재 위치에서 바로 빌드 실행
      - name: Build Wheel
        run: |
          export CPLUS_INCLUDE_PATH=$(brew --prefix)/include
          export LIBRARY_PATH=$(brew --prefix)/lib
          python3 setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-Python3.13-macOS
          path: dist/*.whl
