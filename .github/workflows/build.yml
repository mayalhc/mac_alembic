name: Build PyAlembic 3.13 (Force Boost Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        run: |
          git clone https://github.com/alembic/alembic.git
          git clone https://github.com/AcademySoftwareFoundation/Imath.git imath
          git clone https://github.com/mayalhc/mac_alembic.git myrepo

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake hdf5 boost boost-python3
          python3 -m pip install numpy

      - name: Build Imath
        run: |
          cd imath
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DPYIMATH_ENABLE=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu) install

      - name: Build Alembic (Manual Boost Link)
        run: |
          cd alembic
          mkdir build && cd build
          
          # 3.13 경로 및 Boost 파일 이름 수동 감지
          PY_PREFIX=$(python3 -c "import sys; print(sys.prefix)")
          BOOST_PY_DIR=$(brew --prefix boost-python3)/lib
          
          # 실제 존재하는 boost_python 라이브러리 파일명 찾기 (예: libboost_python313.dylib)
          BOOST_PY_LIB=$(find $BOOST_PY_DIR -name "libboost_python3*.dylib" | head -n 1)
          echo "Found Boost Python Lib: $BOOST_PY_LIB"

          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist \
            -DUSE_PYALEMBIC=ON \
            -DUSE_HDF5=ON \
            -DALEMBIC_SHARED_LIBS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DPYTHON_INCLUDE_DIR=${PY_PREFIX}/include/python3.13 \
            -DPYTHON_LIBRARY=${PY_PREFIX}/lib/libpython3.13.dylib \
            -DImath_DIR=$GITHUB_WORKSPACE/dist/lib/cmake/Imath \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_PYTHON_LIBRARY_RELEASE=$BOOST_PY_LIB \
            -DBoost_PYTHON_LIBRARY_DEBUG=$BOOST_PY_LIB \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dist;$(brew --prefix boost-python3)" \
            -DCMAKE_BUILD_TYPE=Release
          
          # CMake가 여전히 거부할 경우를 대비해 직접 빌드
          make -j$(sysctl -n hw.ncpu) install

      - name: Organize Artifacts
        run: |
          mkdir -p output/alembic
          mkdir -p output/libs
          # 결과물 수집
          find $GITHUB_WORKSPACE/dist -name "*.so" -exec cp {} output/alembic/ \;
          find $GITHUB_WORKSPACE/dist -name "*.dylib" -exec cp {} output/libs/ \;
          # Boost 라이브러리도 함께 복사 (런타임용)
          cp $(brew --prefix boost-python3)/lib/libboost_python3*.dylib output/libs/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PyAlembic-macOS-3.13-Final-Fix
          path: output/
